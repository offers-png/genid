<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GenID Protocol — Settings</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 360px; padding: 20px; color: #1a1a1a; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 4px; color: #444; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #111; color: #fff; font-size: 13px; cursor: pointer; }
    button:hover { background: #333; }
    .status { margin-top: 10px; font-size: 12px; color: #0a7d2c; min-height: 16px; }
    .hint { font-size: 11px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>GenID Protocol</h2>

  <label for="domain">GenID Domain</label>
  <input id="domain" type="text" placeholder="genid.onrender.com" />
  <div class="hint">No https:// prefix — just the bare domain.</div>

  <label for="apiKey">API Key</label>
  <input id="apiKey" type="password" placeholder="gk_live_..." />
  <div class="hint">From your GenID dashboard → API Keys. Stored only in this browser.</div>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
