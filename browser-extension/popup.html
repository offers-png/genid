<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GenID Protocol</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 300px; padding: 16px; color: #1a1a1a; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    p { font-size: 12px; color: #555; line-height: 1.5; margin: 0 0 10px; }

    button:hover { background: #f0f0f0; }

  <h2>GenID Protocol</h2>
  <p>Right-click any AI-generated image on any website → <strong>Certify with GenID</strong>. The full pipeline runs automatically and the certificate PDF downloads itself.</p>

  <div id="resultBox" class="empty">No certifications yet this session.</div>
